<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SysHealth — Instances</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --border: #232936;
    --text: #e6e8ec;
    --muted: #8a93a6;
    --green: #2bd47a;
    --yellow: #f5b73a;
    --red: #ef4f4f;
    --blue: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 22px; }
  .meta { color: var(--muted); font-size: 13px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .host { font-weight: 600; font-size: 16px; }
  .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 8px; vertical-align: middle;
  }
  .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.offline { background: #555; }
  .badge {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge.HEALTHY  { background: rgba(43,212,122,.15); color: var(--green); }
  .badge.DEGRADED { background: rgba(245,183,58,.15); color: var(--yellow); }
  .badge.CRITICAL { background: rgba(239,79,79,.18);  color: var(--red); }
  .badge.UNKNOWN  { background: #2a2f3a; color: var(--muted); }
  .reason { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    font-size: 13px; margin-bottom: 12px;
  }
  .metrics div span { color: var(--muted); }
  .chart-wrap { height: 110px; }
  .empty {
    color: var(--muted); text-align: center; padding: 60px 0;
  }
  #stressBtn {
    background: #1e2a1e; color: var(--green); border: 1px solid #2a4a2a;
    border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #stressBtn:hover { background: #243024; }
  #stressBtn:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>SysHealth — Live Instances</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="meta">Auto-refresh every 3s · <span id="count">0</span> instance(s)</div>
    <button id="stressBtn" onclick="runStress()">⚡ Stress All</button>
  </div>
</header>
<div id="stressResult" style="display:none;margin-bottom:14px;padding:10px 14px;background:#1a1f2e;border:1px solid #2a3a5a;border-radius:8px;font-size:13px;color:#8a93a6"></div>
<div id="grid"></div>
<div id="empty" class="empty">Waiting for agents to report in…</div>

<script>
const charts = {};

function fmt(n, d=2) {
  if (n === undefined || n === null || isNaN(n)) return "—";
  return Number(n).toFixed(d);
}

function cardHTML(inst) {
  const latest = inst.latest || {};
  const state = latest.state || "UNKNOWN";
  const reason = latest.reason || "No data yet";
  return `
    <div class="card-head">
      <div class="host">
        <span class="dot ${inst.online ? "online" : "offline"}"></span>
        ${inst.hostname}
      </div>
      <span class="badge ${state}">${state}</span>
    </div>
    <div class="reason">${reason}${(latest.psi === 0) ? ' <span style="color:#555;font-size:11px">(PSI=0 · instance idle)</span>' : ''}</div>
    <div class="metrics">
      <div><span>PSI:</span> ${fmt(latest.psi, 4)}</div>
      <div><span>Avg PSI:</span> ${fmt(latest.avg_psi, 4)}</div>
      <div><span>pgscan Δ:</span> ${latest.pgscan_delta ?? "—"}</div>
      <div><span>pgsteal Δ:</span> ${latest.pgsteal_delta ?? "—"}</div>
      <div><span>Last seen:</span> ${inst.seconds_since}s ago</div>
      <div><span>Updated:</span> ${latest.received_at || "—"}</div>
    </div>
    <div class="chart-wrap"><canvas id="chart-${inst.hostname}"></canvas></div>
  `;
}

async function renderChart(hostname) {
  const res = await fetch(`/instances/${encodeURIComponent(hostname)}/history`);
  const history = await res.json();
  const labels = history.map((_, i) => i + 1);
  const psi = history.map(h => h.psi);
  const avg = history.map(h => h.avg_psi);

  const ctx = document.getElementById(`chart-${hostname}`);
  if (!ctx) return;

  if (charts[hostname]) {
    charts[hostname].data.labels = labels;
    charts[hostname].data.datasets[0].data = psi;
    charts[hostname].data.datasets[1].data = avg;
    charts[hostname].update("none");
    return;
  }
  charts[hostname] = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "PSI", data: psi, borderColor: "#4f8cff", borderWidth: 2,
          pointRadius: 0, tension: 0.3 },
        { label: "Avg PSI", data: avg, borderColor: "#2bd47a", borderWidth: 1.5,
          borderDash: [4,4], pointRadius: 0, tension: 0.3 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { labels: { color: "#8a93a6", boxWidth: 10 } } },
      scales: {
        x: { display: false },
        y: {
          ticks: { color: "#8a93a6" },
          grid: { color: "#232936" },
          suggestedMin: 0,
          suggestedMax: 0.5
        }
      }
    }
  });
}

async function refresh() {
  try {
    const res = await fetch("/instances");
    const list = await res.json();
    document.getElementById("count").textContent = list.length;
    document.getElementById("empty").style.display = list.length ? "none" : "block";

    const grid = document.getElementById("grid");
    const seen = new Set();
    for (const inst of list) {
      seen.add(inst.hostname);
      let el = document.getElementById(`card-${inst.hostname}`);
      if (!el) {
        el = document.createElement("div");
        el.className = "card";
        el.id = `card-${inst.hostname}`;
        grid.appendChild(el);
      }
      el.innerHTML = cardHTML(inst);
      renderChart(inst.hostname);
    }
    // remove stale cards
    [...grid.children].forEach(c => {
      const host = c.id.replace("card-", "");
      if (!seen.has(host)) {
        c.remove();
        delete charts[host];
      }
    });
  } catch (e) {
    console.error("refresh failed", e);
  }
}

async function runStress() {
  const btn = document.getElementById("stressBtn");
  const result = document.getElementById("stressResult");
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    const res = await fetch("/run-stress", { method: "POST" });
    const data = await res.json();
    const lines = Object.entries(data).map(([h, s]) => `${h}: ${s}`).join(" · ");
    result.textContent = "Stress launched → " + lines;
    result.style.display = "block";
    setTimeout(() => { result.style.display = "none"; }, 8000);
  } catch (e) {
    result.textContent = "Error: " + e;
    result.style.display = "block";
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = "⚡ Stress All"; }, 125000);
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
