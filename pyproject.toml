[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syshealth"
version = "0.2.0"
description = "Saturation-based health and right-sizing for Linux machines, using kernel PSI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["psi", "pressure-stall", "monitoring", "rightsizing", "finops", "linux"]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

# The core deliberately has no runtime dependencies. `syshealth doctor`,
# `watch`, `profile` and `report` must work on a freshly provisioned box with
# nothing but the system Python, because that is exactly when you need them.
dependencies = []

[project.optional-dependencies]
server = ["flask>=3.0"]
# The MCP tool layer. src/syshealth/mcp/tools.py deliberately does not import
# this, so the tools stay testable wherever the SDK is not installed.
mcp = ["mcp>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
syshealth = "syshealth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["syshealth"]
branch = true
