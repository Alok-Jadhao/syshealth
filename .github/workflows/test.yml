name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what Ubuntu 24.04, the fleet's image, runs; 3.14 the newest.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Everything else parses
        run: |
          python -m py_compile *.py tools/*.py docs/*.py
          node --check static/js/dashboard.js
          bash -n deploy.sh terraform/*.sh

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
